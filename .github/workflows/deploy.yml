name: Deploy to Dokploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build lowercase Docker metadata
        id: meta
        run: |
          IMAGE_NAME="${{ env.REGISTRY }}/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy deployment
        run: |
          APP_ID=$(curl -sS \
            "${{ secrets.DOKPLOY_URL }}/api/project.all" \
            -H "Accept: application/json" \
            -H "X-API-Key: ${{ secrets.DOKPLOY_API_KEY }}" \
            | jq -r '.[] | select(.name == "guardmasters") | .applications[]? | select(.name == "web") | .applicationId')

          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            echo "Error: Could not find application 'web' in project 'guardmasters'"
            exit 1
          fi

          echo "Found application ID: $APP_ID"

          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST \
            "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -d "{\"applicationId\": \"$APP_ID\"}")

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Deploy failed with HTTP status: $HTTP_CODE"
            exit 1
          fi

          echo "Deployment triggered successfully"
